; Unisexy.ini - Configuration for Unisexy SKSE mod
; This mod creates gender-flipped versions of head parts (hair, facial hair, scars, eyebrows).
; Set each option to true/false to enable/disable creating gender-flipped versions.

[HeadPartTypes]
; Enable converting female parts to male versions
HairMale=true
ScarsMale=false
BrowsMale=false
FacialHairMale=false
EyesMale=true

; Enable converting male parts to female versions
HairFemale=true
ScarsFemale=false
BrowsFemale=false
FacialHairFemale=false
EyesFemale=true

[Debug]
; Enable detailed logging for debugging
VerboseLogging=false

; Hide vanilla head parts, showing only Unisexy-created versions
ShowOnlyUnisexy=false
